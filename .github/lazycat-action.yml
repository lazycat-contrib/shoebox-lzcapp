version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/shoebox.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: shoebox
    bump: patch
build:
  run_buildscript: false
images:
  # 上游只有 latest/main 等 mutable tag + sha-<commit> 家族，无 semver tag → custom + created + bump: patch
  - id: shoebox
    target: service
    service: shoebox
    source: ghcr.io/devclef/shoebox
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Shoebox
    summary: "一个用于长期整理和保存视频的数字鞋盒"
