application:
  subdomain: shoebox
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://shoebox:3000/
services:
  shoebox:
    # upstream: ghcr.io/devclef/shoebox:latest@sha256:edb79305a4e9b76922c05c5eebee48e3f239ea89947693e57ed1a4cd5fce4b25
    image: registry.lazycat.cloud/czyt/devclef/shoebox:f546abe5a1e93bdb
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      - DATABASE_URL=sqlite:/app/data/videos.db
      - MEDIA_SOURCE_PATHS=/mnt/videos
      - THUMBNAIL_PATH=/app/thumbnails
      - EXPORT_BASE_PATH=/app/exports
      - RUST_LOG=info
    binds:
      - /lzcapp/var/videos:/mnt/videos
      # Mount export directory (read-write)
      - /lzcapp/var/exports:/app/exports
      # Mount data directory for persistence
      - /lzcapp/var/data:/app/data
      # Mount thumbnails directory for persistence
      - /lzcapp/var/thumbnails:/app/thumbnails
